version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rag_mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rag-mysql
      MYSQL_DATABASE: rag_kb
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rag_network

  qdrant:
    image: dockerproxy.net/qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: rag-qdrant
      TZ: Asia/Shanghai
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: always
    command: redis-server --requirepass rag-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_network

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rag_es
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/es:/usr/share/elasticsearch/data
    restart: always
    networks:
      - rag_network

volumes:
  mysql_data:
  qdrant_data:
  redis_data:

networks:
  rag_network:
    driver: bridge
    