services:
  db:
    image: mysql:8.0
    container_name: rag_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: rag_mysql
      MYSQL_DATABASE: rag_kb
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: always
    mem_limit: 512m
    ports:
      - "16333:6333"
      - "16334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: rag_qdrant
      TZ: Asia/Shanghai
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: always
    mem_limit: 256m
    command: redis-server --requirepass rag_redis --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rag_redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: rag_es
    restart: always
    mem_limit: 1g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "19200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    restart: always
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rag_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rag_minio}
      TZ: Asia/Shanghai
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: minio/mc:latest
    container_name: rag_minio_init
    mem_limit: 128m
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rag_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rag_minio}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-rag-kb}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}"
    networks:
      - rag_network

volumes:
  mysql_data:
  qdrant_data:
  redis_data:
  es_data:
  minio_data:

networks:
  rag_network:
    driver: bridge
