name: server-next
on:
  push:
    paths: ['apps/server-next/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/server-next.yml']
  pull_request:
    paths: ['apps/server-next/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/server-next.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --filter server-next... --frozen-lockfile --ignore-scripts
      - run: pnpm check:server-next
